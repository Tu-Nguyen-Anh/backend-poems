spring:
  application:
    name: backend-poems
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/poems_db_prod}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  liquibase:
    change-log: classpath:db/master.xml

server:
  port: ${PORT:8089}
  # Chống HTTP slow attack (Slowloris) + giới hạn tài nguyên/payload.
  # Lưu ý: chống DDoS ồ ạt phải làm chính ở lớp Cloudflare/nginx (rate limit,
  # limit_conn, client_header/body_timeout) — đây là lớp phòng thủ sâu ở app.
  tomcat:
    connection-timeout: ${TOMCAT_CONN_TIMEOUT:8s}   # tối đa để nhận xong request-line + headers
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100
    max-connections: ${TOMCAT_MAX_CONN:8192}
    accept-count: 100
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: 10
    max-swallow-size: 2MB
    max-http-form-post-size: 1MB
  max-http-request-header-size: 16KB

app:
  seo:
    base-url: ${PUBLIC_BASE_URL:https://daithihao.tuvidausotoanthu.vn}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    # Base64-encoded HS256 key (>= 256 bit). Override via JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    org.oplearn: ${LOG_LEVEL:info}
