spring:
  application:
    name: backend-poems
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
    # Ép UTF-8 cho toàn bộ request/response (force=true đè cả Accept-Charset của
    # client) — tránh lỗi ký tự tiếng Việt bất kể môi trường chạy.
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/poems_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Khai báo pool tường minh (trước đây để mặc định). Chỉnh qua ENV nếu cần.
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    # Tắt anti-pattern giữ connection suốt lúc render view (trả connection về pool sớm).
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:poems-notification-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "org.oplearn.project.*"
  liquibase:
    change-log: classpath:db/master.xml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:hazi.poems@gmail.com}
    password: ${MAIL_PASSWORD:fwewldzhnwaojtbf}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8090}
  compression:
    # Nén JSON trả về (trước đây tắt) — giảm băng thông + TTFB cho list/search.
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript,image/svg+xml
    min-response-size: 1024

app:
  seo:
    base-url: ${PUBLIC_BASE_URL:https://daithihao.tuvidausotoanthu.vn}
  auth:
    # Cookie chứa refresh token (HttpOnly). PROD BẮT BUỘC secure=true (HTTPS).
    # FE + API cùng registrable domain (tuvidausotoanthu.vn) → SameSite=Lax đủ.
    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics

security:
  jwt:
    # Base64-encoded HS256 key (>= 256 bit). Override via JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    org.oplearn: ${LOG_LEVEL:info}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:https://rustfs.tuvidausotoanthu.vn}
    region: ${AWS_S3_REGION:us-east-1}
    access-key: ${AWS_S3_ACCESS_KEY:tuviadmin}
    secret-key: ${AWS_S3_SECRET_KEY:bdd21afecd0f29be9fa6c523b27415c22c8e650c6dfe7a3b}
    bucket-name: ${AWS_S3_BUCKET_NAME:poems-media}

