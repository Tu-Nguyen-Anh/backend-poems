name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Chỉ build (skip test): test @SpringBootTest contextLoads cần Postgres/Redis
      # mà runner không có → sẽ fail. Build vẫn bắt được lỗi compile.
      - name: Build
        run: mvn -B -DskipTests package
